description: "Candidate privée de test HAOS pour Élise Investigator, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-v2-rc4-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# V2 RC4 TERRAIN : RC3 conservée, avec enrichissement strictement cover-only des calculs runtime de position.
# Tous les chemins déjà validés restent inchangés : lampes, prises, Tineco, chargeurs, commandes utilisateur.
# Volets périodiques : lorsque la décision n'est pas portée par un choose mais par des variables/templates,
# Investigator lit uniquement les changed_variables de la trace exacte avant le cover.set_cover_position exécuté.
# Entrées reconnues : température, azimut, élévation, luminosité, position brute et position corrigée.
# Le snapshot est rejeté si la position calculée contredit la position réellement commandée.
# Aucun parsing Jinja, aucune relecture de l'état courant, aucune corrélation temporelle large.
# Les guards state/boolean ne sont pas promus comme causes.
# Aucun traitement non-cover n'utilise cette extension ; tests explicites de non-régression conservés.
# Image : ghcr.io/brunofoxmulder/elise-investigator-v2-rc4-private:0.3.0-rc.4
# CI complète : PASS. Image privée amd64 + manifeste : PASS. Validation terrain requise.
# RC3 reste le rollback immédiat ; Dev.54 reste le fallback officiel intact.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
