name: "Élise Investigator 0.2 Test"
version: "0.2.0-dev.45"
slug: "elise_investigator_02_test"
description: "Candidate privée de test HAOS pour Élise Investigator 0.2, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-dev45-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# Dev.45 conserve dev.44 et ajoute un fallback déterministe générique pour les covers.
# Si une automation/script est prouvée mais qu'aucune raison métier n'est extraite,
# une unique commande exécutée cover.set_cover_position sur le même cover permet de
# conserver la preuve technique de position cible calculée et de la propager à l'épisode.
# Investigator ne traduit pas cette preuve en langage métier et n'interprète pas le Jinja.
# Aucun nom d'automatisation/volet n'est codé en dur ; le fallback échoue fermé si la preuve est ambiguë.
# Les réponses legacy restent pilotées par reason ; factors reste additif.
# L'App reste strictement en lecture seule vis-à-vis de Home Assistant.
# La mémoire consciente reste isolée dans /data/conscious_memory.sqlite3.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
  log_level: list(debug|info|warning|error)
  default_window_minutes: int(5,180)
  max_reverse_candidates: int(5,100)
  mcp_connect_url: password?
