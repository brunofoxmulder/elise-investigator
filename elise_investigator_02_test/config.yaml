# DEV.73 TERRAIN : firewall terminal contre le texte natif HA brut après KO terrain dev.72.
# Cas reproduit : reason_code ha_2026_9_activity_native avec "triggered by state of binary_sensor.salle_de_bain_mouvement".
# Correction : tout texte fournisseur commençant par "triggered by" est conservé comme preuve structurée mais interdit comme reason finale, quel que soit son reason_code.
# L'exact trace garde la priorité et toute raison humaine prouvée reste inchangée ; sinon fail closed vers l'automation/script identifié sans inventer de cause.
# Semantics dev.72 conservées : conditions state seules = guards, cause conjointe state + numeric_state conservée lorsqu'elle est prouvée.
# Non-régressions : unavailable/unknown, épisodes cover/volets, délais/waits/timeout et PASS historiques.
# Aucun graphe causal, aucune corrélation temporelle large, aucune connaissance spécifique Maison Cognitive.
# Packaging terrain : image privée amd64 + Dockerfile générique + /run.sh ; aucun run_dev73.sh ni Dockerfile dédié.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev73-private:0.2.0-dev.73
# CI + image : PASS. Validation terrain requise. Lecture seule. Dev.54 reste le fallback officiel intact.
