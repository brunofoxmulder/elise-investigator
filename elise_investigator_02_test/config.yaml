name: "Élise Investigator 0.2 Test"
version: "0.2.0-dev.50"
slug: "elise_investigator_02_test"
description: "Candidate privée de test HAOS pour Élise Investigator 0.2, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-dev50-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# Dev.50 conserve intégralement les corrections dev.49 et la logique cover validée.
# Correction ciblée REG-48-02 : lorsqu'un vrai changement primaire non-cover est déjà
# relié par le contexte Home Assistant à une automation/script précise, Investigator
# peut récupérer la cause depuis un wait_for_trigger imbriqué immédiatement avant
# l'action d'effet dans la même séquence exécutée, y compris si la device action
# n'expose pas l'entity_id canonique dans ses params runtime.
# Le fallback reste borné : source exacte déjà prouvée, effet off↔on, action unique
# sémantiquement compatible dans les 5 secondes, wait_for_trigger terminé juste avant.
# Les entités cover.* et les changements d'attribut sont exclus de ce fallback.
# Replay aspirateur sans mock d'extracteur : PASS. Suite complète : 232/232 tests PASS.
# Image privée dev.50 construite, publiée et manifeste OCI vérifié avant promotion.
# L'App reste strictement en lecture seule vis-à-vis de Home Assistant.
# La mémoire consciente reste isolée dans /data/conscious_memory.sqlite3.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
  log_level: list(debug|info|warning|error)
  default_window_minutes: int(5,180)
  max_reverse_candidates: int(5,100)
  mcp_connect_url: password?
