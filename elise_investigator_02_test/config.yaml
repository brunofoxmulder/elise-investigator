# DEV.61 TERRAIN : Logbook/Activity identifie le fait et l'automatisation source ; la trace exacte explique l'action.
# Le fait terminal (open/closed) reste le fait expliqué : il n'est jamais remplacé par opening/closing.
# Pour un volet terminal sans attribution directe, seule la paire fonctionnelle adjacente opening->open ou closing->closed
# peut fournir l'attribution portée par la ligne de mouvement ; aucune fenêtre temporelle arbitraire n'est utilisée.
# Pour une automation/script identifiée, seule la trace exacte de CETTE exécution est consultée pour la raison fonctionnelle.
# Un seul maillon amont est autorisé, uniquement si cette trace désigne explicitement une autre entité.
# Ce maillon amont est lui-même résolu par Logbook + trace exacte, sans récursion ni graphe causal général.
# Cas terrain de référence : T>28 C -> Gestion volet salon -> volet fermé -> Ambiance du jour -> lampe cuisine ON.
# Une fermeture manuelle du volet reste une commande utilisateur et ne doit jamais être assimilée à cette chaîne automatisée.
# Le context_source natif reste seulement un indice conservateur si la trace exacte n'ajoute aucune explication.
# unknown/unavailable seuls sont filtrés ; période 12 h par défaut, réglable via le réglage de rétention existant.
# Régressions couvertes : Tineco, aspirateur, chargeur casque, terminal volets, fermeture manuelle, chaîne volet->lampe.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev61-private:0.2.0-dev.61
# CI + build/push + vérification manifeste : PASS. App strictement en lecture seule vis-à-vis de Home Assistant.
