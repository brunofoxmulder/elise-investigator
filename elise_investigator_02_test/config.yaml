# DEV.59 TERRAIN : simplification Activity-first pour Home Assistant 2026.9.
# Le chemin normal "pourquoi" lit directement Activity/Logbook sur la période configurée.
# unknown/unavailable sont ignorés uniquement comme bruit technique de sélection.
# Le dernier événement Activity utile fournit directement l'origine et la cause natives HA.
# Si une ligne terminale appartient au même court épisode Activity mais ne porte pas l'attribution,
# la ligne Activity immédiatement précédente de cet épisode peut être retenue.
# Si Activity identifie une automation/script mais ne donne pas assez de détail,
# seule la trace de CETTE exécution identifiée est consultée.
# Aucun graphe causal ni recherche inverse générale n'est reconstruit dans le chemin normal.
# Période : 12 h par défaut, réglable via le réglage de rétention existant.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev59-private:0.2.0-dev.59
# CI + build/push + vérification manifeste : PASS. App strictement en lecture seule vis-à-vis de Home Assistant.
