init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# V2 RC11 TERRAIN : récupération générique de la commande au chemin runtime exact lorsque `result.params` est absent.
# Priorité inchangée : `result.params` reste la preuve autoritaire dès qu'il existe ; aucun repli vers la configuration n'est alors autorisé.
# Sans `result.params`, RC11 lit exclusivement le nœud de `trace["config"]` situé au même chemin `action/...` que l'étape exécutée.
# Pour une device action, la référence opaque `entity_id` est résolue par correspondance exacte avec l'ID d'entrée du registre d'entités HA,
# puis vérifiée contre l'entity_id canonique, le device_id et le domaine attendus. Une correspondance fondée sur le seul device_id est refusée.
# Le resolver default/delay RC9, le renderer, les chemins déjà validés et dev.54 restent strictement inchangés.
# Qualification : 375/375 tests PASS ; non-régressions ciblées 61/61 PASS ; image et manifeste privés amd64 vérifiés.
# Image : ghcr.io/brunofoxmulder/elise-investigator-v2-rc11-private:0.3.0-rc.11
# Validation terrain prioritaire : switch.prise_aspirateur OFF sur la branche choose default réelle.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
