name: "Élise Investigator 0.2 Test"
version: "0.2.0-dev.47"
slug: "elise_investigator_02_test"
description: "Candidate privée de test HAOS pour Élise Investigator 0.2, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-dev47-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# Dev.47 conserve intégralement dev.46 et corrige uniquement la sélection des
# questions génériques d'état allumé/éteint : un changement d'attribut ultérieur
# comme brightness ne masque plus le dernier vrai changement d'état primaire.
# Toute demande explicite d'attribut, de valeur ou d'heure conserve la sémantique
# dev.46. Les entités cover.* sont exclues du nouveau sélecteur et conservent
# strictement la logique validée par épisodes dev.45/dev.46.
# Aucun nom d'automatisation/objet Maison Cognitive n'est codé en dur.
# L'App reste strictement en lecture seule vis-à-vis de Home Assistant.
# La mémoire consciente reste isolée dans /data/conscious_memory.sqlite3.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
  log_level: list(debug|info|warning|error)
  default_window_minutes: int(5,180)
  max_reverse_candidates: int(5,100)
  mcp_connect_url: password?
