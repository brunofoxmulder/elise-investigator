# symétrique le rattachement des épisodes opening/closing des covers. Les positions
# partielles et les garde-fous de preuve de dev.32 restent inchangés.
# La recherche approfondie reste séparée pour l'IHM via /api/v1/investigate/deep.
# L'app reste strictement en lecture seule vis-à-vis de Home Assistant.
