name: "Élise Investigator 0.2 Test"
version: "0.3.0-rc.1"
slug: "elise_investigator_02_test"
description: "Candidate privée de test HAOS pour Élise Investigator, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-v2-rc1-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# V2 RC1 TERRAIN : refonte du moteur causal centrée sur l'action cible.
# Une seule chaîne sémantique : preuves Activity/Logbook/trace -> résolveur V2 -> renderer V2 -> réponse.
# Les barrières temporelles ne comptent que si elles précèdent réellement la commande cible.
# Présence ON : un wait_for_trigger ultérieur ne masque plus le trigger mouvement initial.
# Présence OFF : wait_for_trigger/délai local garde la priorité lorsqu'il libère l'action.
# Volets : cover.set_cover_position est reconnu comme commande exacte selon la position/effect observé.
# Causes conjointes prouvées conservées, dont heures creuses + seuil batterie ; guards simples non promus.
# time_pattern rendu comme cause structurée lorsqu'il est le trigger réellement exécuté.
# unavailable/unknown, commandes utilisateur et épisodes cover restent protégés par les non-régressions historiques.
# Aucun texte natif HA brut "triggered by ..." n'est exposé comme raison finale.
# Pas de graphe causal, pas de corrélation temporelle large, pas de règle spécifique à une entité Maison Cognitive.
# Image : ghcr.io/brunofoxmulder/elise-investigator-v2-rc1-private:0.3.0-rc.1
# CI complète + image privée amd64 + manifeste : PASS. Validation terrain requise.
# Dev.54 reste le fallback officiel intact.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
  log_level: list(debug|info|warning|error)
  default_window_minutes: int(5,180)
  max_reverse_candidates: int(5,100)
  mcp_connect_url: password?
