# DEV.62 TERRAIN : même architecture Logbook/Activity + trace exacte que dev.61.
# Correction unique : si la trace exacte prouve une branche choose réellement sélectionnée,
# contenant une seule condition supportée qui mène à l'action sur la cible, cette condition
# devient la raison fonctionnelle avant le trigger technique de l'automatisation.
# Cas terrain de référence : time pattern déclenche/réévalue Gestion volet salon, mais la
# branche exécutée ferme le volet parce que la température extérieure dépasse 28 °C.
# La réponse attendue est donc T>28 °C, jamais "triggered by time pattern" dans ce cas prouvé.
# Si plusieurs conditions sont présentes ou si la branche/action n'est pas prouvée, aucune
# condition métier n'est devinée : le comportement antérieur fail-closed est conservé.
# Le fait terminal open/closed, la fermeture manuelle, le saut amont unique volet->lampe,
# Tineco, aspirateur et chargeur casque restent couverts par les régressions antérieures.
# Aucun graphe causal, aucune recherche inverse générale, aucune corrélation temporelle arbitraire.
# unknown/unavailable seuls sont filtrés ; période 12 h par défaut, réglable.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev62-private:0.2.0-dev.62
# CI + build/push + vérification manifeste : PASS. App strictement en lecture seule vis-à-vis de Home Assistant.
