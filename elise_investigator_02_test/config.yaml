name: "Élise Investigator 0.2 Test"
version: "0.2.0-dev.34.1"
slug: "elise_investigator_02_test"
description: "Candidate privée de test HAOS pour Élise Investigator 0.2, strictement en lecture seule."
arch:
  - amd64
image: "ghcr.io/brunofoxmulder/elise-investigator-dev34-private"
init: false
startup: application
boot: manual
stage: experimental
homeassistant_api: true
# Dev.34.1 conserve la mémoire consciente de dev.34 mais l'isole de l'ancien
# journal causal dev.29-dev.33. La nouvelle mémoire utilise son propre fichier
# /data/conscious_memory.sqlite3 ; l'ancien /data/causal_journal.sqlite3 reste intact
# pour rollback et n'est plus consulté par le chemin conversationnel dev.34.1.
# La mémoire est de 12 h par défaut, réglable de 1 à 72 h dans l'IHM.
# /api/v1/investigate reste la porte stable connue d'Élise Why dev.18 et renvoie
# status=confirmed pour compatibilité ; aucun niveau de certitude n'est calculé.
# Si aucune cause n'est disponible, la réponse est « Je n'ai pas trouvé la cause. »
# Le journal diagnostic entrée/sortie reste séparé du raisonnement.
# L'enquête approfondie reste séparée via /api/v1/investigate/deep.
# L'app reste strictement en lecture seule vis-à-vis de Home Assistant.
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:magnify-scan
panel_title: Élise Investigator 0.2 Test
panel_admin: true
apparmor: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "API locale désactivée par défaut"
options:
  log_level: info
  default_window_minutes: 30
  max_reverse_candidates: 25
  mcp_connect_url: ""
schema:
  log_level: list(debug|info|warning|error)
  default_window_minutes: int(5,180)
  max_reverse_candidates: int(5,100)
  mcp_connect_url: password?
