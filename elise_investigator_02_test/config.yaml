# DEV.71 TERRAIN : correctif ciblé de dev.70 KO terrain sur trois défauts génériques prouvés.
# 1) Un hint Activity natif du type "triggered by state of ..." reste une preuve intermédiaire et ne devient jamais la réponse causale finale brute.
# 2) Les conditions/guards ne sont plus promues automatiquement comme cause principale ; les causes conjointes restent conservées lorsqu'un trigger state/numeric_state est réellement prouvé.
# 3) Un trigger initial n'est plus recyclé comme cause d'une action différée lorsqu'une barrière temporelle locale exécutée (delay, wait_for_trigger, timeout/wait_template) explique la séquence.
# Bornes : aucun graphe causal, aucune corrélation temporelle large, aucune réécriture du moteur, fail closed si preuve locale insuffisante.
# Non-régressions à préserver : unavailable/unknown, épisodes cover/volets, PASS dev.67 -> dev.70, Tineco, chargeurs, lampes simples/manuelles et chaînes profondes déjà validées.
# Packaging terrain conservé : image privée amd64 + Dockerfile générique + /run.sh ; aucun launcher run_dev71.sh ni Dockerfile dédié.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev71-private:0.2.0-dev.71
# CI et publication image : PASS. Démarrage HAOS + Ingress et recette fonctionnelle restent à valider sur le terrain.
# Lecture seule. Dev.54 reste le fallback officiel intact.
