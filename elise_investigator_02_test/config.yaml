homeassistant_api: true
# V2 RC7 TERRAIN : durcissement générique de la sélection de la trace exacte.
# Le moteur causal V2 / resolver reste inchangé ; RC7 agit uniquement sur l'acquisition/sélection de preuve.
# Plusieurs traces du même automate ne sont départagées qu'après preuve d'une commande exécutée correspondant exactement à l'effet observé.
# Priorité au timestamp runtime de la commande ; le démarrage de trace sert uniquement de discriminant secondaire borné.
# Sans timestamp de commande, une trace n'est retenue que si elle est l'unique trace exacte la plus proche ; égalité => échec fermé.
# Le texte natif Home Assistant "triggered" seul est désormais filtré comme "triggered by ..." et ne peut plus devenir une cause utilisateur.
# Le rendu RC6 avec âge relatif de l'événement est conservé à l'identique.
# Aucun nouveau support climate/attribut dans cette RC. Dev.54 reste le fallback officiel intact.
# Image : ghcr.io/brunofoxmulder/elise-investigator-v2-rc7-private:0.3.0-rc.7
# CI complète : PASS. Image privée amd64 + manifeste : PASS. Validation terrain RC7 requise sur volets et prises.
