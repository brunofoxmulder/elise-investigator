# Corrections ciblées issues des défauts terrain dev.62 :
# - reprendre une attribution native HA portée par une ligne Activity liée explicitement par context id/parent_id ;
# - reconnaître le timeout d'un wait_for_trigger lorsqu'il libère directement l'action finale ;
# - restituer 1 à 4 conditions state/numeric_state conjointes uniquement si la branche choisie et toutes
#   les conditions sont prouvées vraies par la trace exacte et que l'action exécutée correspond à la cible.
# Cas de référence : Yaourtière OFF attribuée à Aaaayaourt ; prise lampes évier OFF après timeout 4 h ;
# chargeur téléphone ON par heures creuses + batterie basse ; repositionnement volet avec attribution native.
# Fail closed si la trace est ambiguë ou non supportée. Aucun graphe causal, aucune corrélation temporelle large,
# aucune recherche d'entités non liées. unknown/unavailable seuls sont filtrés ; période 12 h par défaut, réglable.
# Image : ghcr.io/brunofoxmulder/elise-investigator-dev63-private:0.2.0-dev.63
# Tests + build/push + vérification manifeste : PASS. App strictement en lecture seule vis-à-vis de Home Assistant.
