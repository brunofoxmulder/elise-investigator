# V2 RC2 TERRAIN : RC1 conservée, avec extension strictement cover-only.
# Tous les chemins déjà validés restent inchangés : lampes, prises, Tineco, chargeurs, commandes utilisateur.
# Volets : récupération de l'attribution depuis la ligne de mouvement adjacente quand un repositionnement partiel
# finit en état HA open/closed sans contexte natif sur la ligne terminale.
# Volets périodiques : lorsqu'un time_pattern prouvé mène à cover.set_cover_position, la position réellement
# demandée est ajoutée à l'explication sans promouvoir les guards/conditions en fausses causes.
# Aucun traitement non-cover n'utilise cette extension ; les tests refusent explicitement les switches.
# Une seule chaîne sémantique V2 reste active : preuves Activity/Logbook/trace -> résolveur V2 -> renderer V2.
# Aucun texte natif HA brut "triggered by ..." n'est exposé comme raison finale.
# Pas de graphe causal, pas de corrélation temporelle large, pas de règle spécifique à une entité Maison Cognitive.
# Image : ghcr.io/brunofoxmulder/elise-investigator-v2-rc2-private:0.3.0-rc.2
# CI complète : PASS. Image privée amd64 + manifeste : PASS. Validation terrain requise.
# Dev.54 reste le fallback officiel intact.
