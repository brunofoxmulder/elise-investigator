name: Tests dev.54 from dev.46 baseline

on:
  push:
    branches:
      - dev54-assist-satellite-user-origin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev.54
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check aiohttp

      - name: Compile Python sources
        run: python -m compileall -q elise_investigator/app tests

      - name: Run complete unit and digital-twin test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
