name: Publish V2 RC5 private image

on:
  push:
    branches:
      - candidate-v2-rc5
    paths:
      - '.github/workflows/publish-v2-rc5-image.yml'
      - 'elise_investigator/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    if: github.repository == 'brunofoxmulder/elise-investigator' && github.ref == 'refs/heads/candidate-v2-rc5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 RC5
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 candidate image
        uses: docker/build-push-action@v6
        with:
          context: ./elise_investigator
          file: ./elise_investigator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brunofoxmulder/elise-investigator-v2-rc5-private:0.3.0-rc.5.1
          build-args: |
            BUILD_VERSION=0.3.0-rc.5.1
            BUILD_ARCH=amd64

      - name: Verify published image manifest
        run: docker buildx imagetools inspect ghcr.io/brunofoxmulder/elise-investigator-v2-rc5-private:0.3.0-rc.5.1
