name: Import beta package

on:
  push:
    paths:
      - 'elise-investigator-beta-0.1.0.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract beta repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elise-beta
          mkdir -p /tmp/elise-beta
          unzip -q elise-investigator-beta-0.1.0.zip -d /tmp/elise-beta
          src="$(find /tmp/elise-beta -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$src"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$src/" ./
          rm -f elise-investigator-beta-0.1.0.zip

      - name: Commit imported beta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Élise Investigator Beta 0.1.0' || exit 0
          git push
