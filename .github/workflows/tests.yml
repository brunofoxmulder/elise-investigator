name: Tests

on:
  push:
    branches: [main, dev17-mcp-console, dev18-mcp-console-terrain, dev19-mcp-discovery-terrain, dev20-mcp-inprocess-terrain, dev21-mcp-option-terrain, dev22-mcp-handshake-terrain]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check aiohttp

      - name: Compile Python sources
        run: python -m compileall -q elise_investigator/app tests

      - name: Run unit and digital-twin tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
