name: Publish dev.66 private image

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - dev66-packaging-executable-launcher

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    if: >-
      github.repository == 'brunofoxmulder/elise-investigator' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev66-packaging-executable-launcher'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested dev.66 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local amd64 candidate for packaging checks
        uses: docker/build-push-action@v6
        with:
          context: ./elise_investigator
          file: ./elise_investigator/Dockerfile.dev66
          platforms: linux/amd64
          load: true
          push: false
          tags: elise-investigator-dev66:packaging-check
          build-args: |
            BUILD_VERSION=0.2.0-dev.66
            BUILD_ARCH=amd64

      - name: Validate executable launcher and Home Assistant wrapper
        run: |
          docker run --rm --entrypoint /bin/sh elise-investigator-dev66:packaging-check -c 'test -x /run_dev66.sh && test -x /usr/bin/with-contenv && grep -q "exec python3 main_dev66.py" /run_dev66.sh'
          docker inspect elise-investigator-dev66:packaging-check --format '{{json .Config.Cmd}}' | grep -q 'with-contenv'
          docker inspect elise-investigator-dev66:packaging-check --format '{{json .Config.Cmd}}' | grep -q 'run_dev66.sh'
          docker run --rm --entrypoint /bin/sh elise-investigator-dev66:packaging-check -c '/run_dev66.sh' >/tmp/dev66-launch.log 2>&1 || true
          ! grep -q 'Permission denied' /tmp/dev66-launch.log

      - name: Build and publish amd64 candidate image
        uses: docker/build-push-action@v6
        with:
          context: ./elise_investigator
          file: ./elise_investigator/Dockerfile.dev66
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brunofoxmulder/elise-investigator-dev66-private:0.2.0-dev.66
          build-args: |
            BUILD_VERSION=0.2.0-dev.66
            BUILD_ARCH=amd64

      - name: Verify published image manifest
        run: docker buildx imagetools inspect ghcr.io/brunofoxmulder/elise-investigator-dev66-private:0.2.0-dev.66
