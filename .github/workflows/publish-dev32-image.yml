name: Publish dev.33 private image

on:
  push:
    branches:
      - dev33-journal-cover-episodes
    paths:
      - '.github/workflows/publish-dev32-image.yml'
      - 'elise_investigator/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    if: github.repository == 'brunofoxmulder/elise-investigator' && github.ref == 'refs/heads/dev33-journal-cover-episodes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev.33
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 candidate image
        uses: docker/build-push-action@v6
        with:
          context: ./elise_investigator
          file: ./elise_investigator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brunofoxmulder/elise-investigator-dev33-private:0.2.0-dev.33
          build-args: |
            BUILD_VERSION=0.2.0-dev.33
            BUILD_ARCH=amd64

      - name: Verify published image manifest
        run: docker buildx imagetools inspect ghcr.io/brunofoxmulder/elise-investigator-dev33-private:0.2.0-dev.33
