name: Publish RC15 test image after approval

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.repository == 'brunofoxmulder/elise-investigator' &&
      github.event.pull_request.number == 89 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'candidate-rc14-ha-2026-11-aliases' &&
      github.event.label.name == 'publish-rc15-test-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run candidate tests
        run: |
          python -m pip install --disable-pip-version-check aiohttp
          python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Build and verify image before publishing
        run: |
          docker build --file elise_investigator/Dockerfile.rc15_ha202611 \
            --build-arg BUILD_VERSION=0.3.0-rc.15 --build-arg BUILD_ARCH=amd64 \
            --tag rc15-review ./elise_investigator
          docker run --rm --entrypoint python3 rc15-review -c '
          import pathlib
          import main_v2_rc15_ha202611 as candidate
          from ha_client import HAReadOnlyClient
          assert candidate.VERSION == "0.3.0-rc.15"
          assert "main_v2_rc15_ha202611.py" in pathlib.Path("/run.sh").read_text()
          assert "config/entity_registry/get_entries" in HAReadOnlyClient._ALLOWED_WS_TYPES
          '
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish uniquely tagged test image
        env:
          IMAGE: ghcr.io/brunofoxmulder/elise-investigator-rc15-test
        run: |
          set -eu
          tag="0.3.0-rc.15-test-${GITHUB_RUN_ID}"
          docker tag rc15-review "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          docker buildx imagetools inspect "$IMAGE:$tag"
          echo "Published test tag: $IMAGE:$tag"
          echo "Reviewed commit: ${{ github.event.pull_request.head.sha }}"
