name: Virtual HA causal probe

on:
  pull_request:
    branches:
      - dev54-assist-satellite-user-origin
    paths:
      - "elise_investigator/**"
      - "tests/digital_twin.py"
      - "tests/virtual_ha/**"
      - "tests/test_virtual_ha_scenarios.py"
      - ".github/workflows/virtual-ha-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run timeline safety tests
        run: python -m unittest tests.test_virtual_ha_scenarios
      - name: Replay brightness timeline against checked-out Investigator
        run: python tests/virtual_ha/probe.py
