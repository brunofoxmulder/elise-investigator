name: Publish dev.52 clean rebuild image

on:
  push:
    branches:
      - dev52-clean-dev46-rebuild
    paths:
      - '.github/workflows/publish-dev52-image.yml'
      - 'elise_investigator/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.repository == 'brunofoxmulder/elise-investigator' && github.ref == 'refs/heads/dev52-clean-dev46-rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev.52
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install aiohttp
      - name: Compile candidate
        run: python -m compileall -q elise_investigator/app
      - name: Run full unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  build-publish:
    needs: test
    if: github.repository == 'brunofoxmulder/elise-investigator' && github.ref == 'refs/heads/dev52-clean-dev46-rebuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev.52
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 clean rebuild image
        uses: docker/build-push-action@v6
        with:
          context: ./elise_investigator
          file: ./elise_investigator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/brunofoxmulder/elise-investigator-dev52-private:0.2.0-dev.52
          build-args: |
            BUILD_VERSION=0.2.0-dev.52
            BUILD_ARCH=amd64
      - name: Verify published image manifest
        run: docker buildx imagetools inspect ghcr.io/brunofoxmulder/elise-investigator-dev52-private:0.2.0-dev.52
